<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Веземо24">
  <!-- КВАДРАТ НА ВСЮ ПЛОЩУ, без прозорих кутів і без власного кола.
       Google обрізає фавікон у коло й підкладає біле тло. Попередня
       іконка сама була синім колом на прозорому фоні, тому у видачі
       вона показувалась як коло всередині білого кола — з тим самим
       білим обідком, на який скаржився клієнт. Заокруглення додає той,
       хто показує іконку; ми віддаємо повний квадрат. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <text x="32" y="45.5" text-anchor="middle" fill="#ffffff"
        font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="36" letter-spacing="-1.5">24</text>
</svg>
