<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vezemo24">
  <!-- КВАДРАТ НА ВСЮ ПЛОЩУ, без прозорих кутів. Google обрізає фавікон у
       коло й підкладає під нього біле тло: іконка, намальована колом,
       показується у видачі як коло всередині білого кола — з тим самим
       білим обідком, на який скаржилися. Тому тло тут суцільне.

       Малюнок — фургон із лініями швидкості, за ескізом власника. Від
       ескіза свідомо відрізняється трьома речами, і кожна з них потрібна
       саме для маленьких розмірів:

       1) Суцільна заливка замість контуру. Обведення в 2px на 16px екрана
          має товщину півпікселя й перетворюється на сіру кашу.
       2) Без цифр «24». Найтонша деталь ескіза — і зникає першою; назва
          поруч із знаком усе одно її несе.
       3) Знак не на всю плитку. Композицію диктує КОЛО, а не квадрат:
          усе важливе тримається в середині, синє поле домінує, і у видачі
          іконка читається суцільним кольоровим кружком.

       Дві лінії швидкості, а не три: на 16px три зливаються в одну. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <g fill="#ffffff">
    <rect x="11" y="23.5" width="9" height="4.5" rx="2.25"/>
    <rect x="11" y="32" width="6" height="4.5" rx="2.25"/>
    <path d="M22 20 H41 V27 H45 L50 33 V39 H22 Z"/>
    <circle cx="29" cy="41" r="4.6"/>
    <circle cx="44.5" cy="41" r="4.6"/>
  </g>
  <g fill="#0ea5e9">
    <circle cx="29" cy="41" r="1.8"/>
    <circle cx="44.5" cy="41" r="1.8"/>
  </g>
</svg>
