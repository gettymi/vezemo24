<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vezemo24">
  <!-- КВАДРАТ НА ВСЮ ПЛОЩУ, без прозорих кутів. Google вимагає квадрат від
       48px і стабільну адресу; полів він не додає — їх домальовує та
       поверхня, яка іконку показує. У видачі це КОЛО, і саме воно диктує
       композицію: кути зрізає, тож усе важливе має триматися в середині.

       Через це знак навмисно НЕ на всю плитку. Перша спроба була вдвічі
       більшою — і в колі біла дорога з'їдала синє поле майже повністю,
       через що іконка читалась як «біла пляма з синіми залишками». Тепер
       навпаки: синє поле домінує, дорога сидить у центрі й до краю кола
       не дотягується. Саме так виглядають іконки, які в пошуку читаються
       суцільним кольоровим кружком.

       Дві смуги розмітки, а не три: на 16px три зливаються в одну лінію. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <path d="M17 50 L27 15 L37 15 L47 50 Z" fill="#ffffff"/>
  <g fill="#0ea5e9">
    <rect x="30" y="19" width="4" height="9" rx="2"/>
    <rect x="29.2" y="34" width="5.6" height="12" rx="2.8"/>
  </g>
</svg>
