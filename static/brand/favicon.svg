<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vezemo24">
  <!-- Знак власника: фургон із лініями швидкості. Малюнок його, форма
       підкладки — ні, і ось чому.

       В оригіналі фургон стоїть усередині відкритого кільця на прозорому
       тлі. У пошуку Google обрізає фавікон У КОЛО й підкладає під нього
       біле: прозоре тло стає білим, а кільце — другим контуром усередині
       кола. Разом це і давало той білий обідок, на який ми скаржилися.

       Тому кільце тут не намальоване, а є самою плиткою: суцільний
       квадрат на всю площу, без прозорих кутів. Обрізання в коло
       перетворює його рівно на те кільце, яке було в ескізі, тільки без
       дірки. Фургон — білим, обведення трохи товще за оригінальне
       (0,76 px на 16-піксельній іконці замість 0,44), інакше на вкладці
       лінії тонші за піксель і розмиваються в сіру кашу.

       Малюнок навмисно не на всю плитку: композицію диктує коло, тож усе
       важливе тримається в середині й до краю не дотягується.

       Той самий малюнок у шапці сайту — templates/partials/_logo.html,
       там кільце залишилося, бо на 40-110 px воно читається. Правити
       геометрію треба одразу в обох файлах. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <g transform="translate(32,32) scale(0.095) translate(-264,-256.5)">
    <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 178 H165"/>
      <path d="M57 232 H165"/>
      <path d="M38 290 H165"/>
      <path d="M112 128 H352 L300 345 H108"/>
      <path d="M352 182 H424 Q490 182 490 256 V345 H452"/>
      <path d="M240 345 H368"/>
      <circle cx="200" cy="345" r="40"/>
      <circle cx="410" cy="345" r="40"/>
    </g>
  </g>
</svg>
