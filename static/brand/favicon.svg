<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vezemo24">
  <!-- КВАДРАТ НА ВСЮ ПЛОЩУ, без прозорих кутів і без власного кола.
       Google обрізає фавікон у коло й підкладає біле тло, тому іконка,
       намальована колом на прозорому фоні, показувалась у видачі як коло
       всередині білого кола — з тим самим білим обідком, на який
       скаржився клієнт. Заокруглення додає той, хто показує іконку;
       ми віддаємо повний квадрат.

       Знак — дорога, що йде до горизонту. Обраний із чотирьох варіантів:
       говорить саме про міжміські рейси (те, чим найбільше цікавиться
       замовник), однаково читається всіма трьома мовами й не залежить
       від літери. Розмітка навмисно розширюється донизу — на 16 px
       трапеція має бути помітно ширшою за смугу, інакше читається як
       вежа, а не як дорога. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <path d="M10 56 L25 12 L39 12 L54 56 Z" fill="#ffffff"/>
  <g fill="#0ea5e9">
    <rect x="30.4" y="16" width="3.2" height="8" rx="1.6"/>
    <rect x="30" y="29" width="4" height="9" rx="2"/>
    <rect x="29.4" y="43" width="5.2" height="10" rx="2.6"/>
  </g>
</svg>
