<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vezemo24">
  <!-- Іконка для вкладки й пошуку. Малюнок фургона — власника, з
       static/brand/logo-icon.svg (експорт із Figma); тут він приведений
       до того, що витримує малий розмір.

       Три відмінності від експорту, і кожна обов'язкова:

       1) Кільця немає. Google обрізає фавікон У КОЛО й підкладає біле,
          тож намальоване кільце дає другий контур усередині кола і той
          самий білий обідок, який ми прибирали. Тут кільце — це сама
          плитка: суцільний квадрат на всю площу, без прозорих кутів.
       2) Обведення 3,85 замість 1,78 одиниці (14,256 у полотні 512).
          Тонше — це менш ніж пів пікселя на 16-піксельній вкладці, лінії
          розмиваються в сіру кашу.
       3) Малюнок зменшено. В експорті лінії швидкості зліва й кабіна
          справа підходили до самого краю — коло зрізало б їм кінці.

       Той самий фургон у шапці — templates/partials/_logo.html, там
       кільце залишилося: на 40-112 px тонкий контур читається. Правити
       геометрію треба одразу в обох файлах. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <g transform="translate(32,32) scale(0.1069) translate(-255.7,-250)">
    <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
