<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64"
     role="img" aria-label="Vezemo24">
  <!-- width/height стоять поруч із viewBox навмисно. Без них файл має
       лише пропорцію, і будь-що, що показує SVG як окрему картинку —
       Quick Look, Перегляд, <img> без розмірів, попередній перегляд у
       Finder — бере типові 300x150 і показує знак розтягнутим і
       обрізаним. У браузері на сайті це не видно, бо розмір задає CSS,
       тому помилку легко не помітити. -->
  <!-- Іконка для вкладки й пошуку. Малюнок — власника, з
       static/brand/logo-icon.svg; тут він приведений до того, що
       витримує малий розмір.

       1) Кільця немає. Google обрізає фавікон У КОЛО й підкладає біле,
          тож намальоване кільце дає другий контур і той самий білий
          обідок. Тут кільце — сама плитка: суцільний квадрат на всю
          площу, без прозорих кутів.
       2) Обведення 23,6 у полотні 512 (14,256 в експорті — це менш ніж пів
          пікселя на 16-піксельній вкладці й розмивається в сіру кашу).
          Було 34, потім 30 — і все одно читалося жирно. Замість того щоб
          просто худнути,
          лінії швидкості стали ДОВШИМИ — ліві кінці зсунуті з 53/90/20 на
          25/50/5. Довга тонка лінія тримає відчуття руху краще, ніж
          коротка товста, і не з'їдає простір усередині кола.

          Через це знак у шапці (templates/partials/_logo.html) тепер має
          трохи коротші лінії, ніж іконка. Так і задумано: у шапці він
          великий, там довші лінії не потрібні.

          Нижче за 23,6 не опускатися: це вже 0,65 пікселя на 16-піксельній
          вкладці. На екрані з подвоєною щільністю (де вкладка малюється в
          32 точки) усе ще чітко, а на звичайному лінії починають бліднути
          швидше, ніж тоншати.
       3) Малюнок зменшено й відцентровано (в експорті він сидів низько
          і впирався в краї, коло зрізало б лінії швидкості й кабіну).

       Той самий фургон у шапці — templates/partials/_logo.html, там
       кільце є. Правити геометрію треба одразу в обох файлах. -->
  <rect width="64" height="64" fill="#0ea5e9"/>
  <g transform="translate(32,32) scale(0.1104) translate(-232.86,-275.16)">
    <g fill="none" stroke="#ffffff" stroke-width="23.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M71.0499 143.24H346.192L310.58 219.38M346.192 143.24L236.047 378.734M310.58 219.38L236.047 378.734M310.58 219.38H354.415C360.32 219.38 365.107 224.167 365.107 230.072V267.008C365.107 272.913 369.894 277.7 375.799 277.7H450.022C455.927 277.7 460.714 282.487 460.714 288.392V368.042C460.714 373.947 455.927 378.734 450.022 378.734H432.58M236.047 378.734H180.4M236.047 378.734H365.107M71.0499 378.734C71.0499 378.734 102.914 378.734 117.76 378.734M25 238.874H200.542M50 192.717H200.542M200.542 286.988H5"/>
      <circle cx="397.966" cy="379.166" r="27.918"/>
      <circle cx="149.566" cy="373.172" r="27.918"/>
    </g>
  </g>
</svg>
