<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Веземо24">
  <!-- На весь квадрат, без прозорих полів: Google обрізає фавікон у коло
       й підкладає біле тло, тому іконка з прозорими кутами показувалась
       як синє коло всередині білого — з видимим білим обідком. -->
  <rect width="64" height="64" rx="14" fill="#0ea5e9"/>
  <text x="32" y="45.5" text-anchor="middle" fill="#ffffff"
        font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="36" letter-spacing="-1.5">24</text>
</svg>
