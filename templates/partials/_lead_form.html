{# Форма заявки. Мінімум обовʼязкових полів: лише телефон.
   Решта — за розкриттям, щоб не лякати обсягом. #}
<form id="contactForm" method="POST" action="{{ url_for('contact.contact_submit') }}" novalidate class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {# Бекенд відповідає тією ж мовою, якою людина заповнювала форму. #}
  <input type="hidden" name="lang" value="{{ LOCALE }}">

  <div class="honeypot" aria-hidden="true">
    <label for="website">{{ t('form.honeypot') }}</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <div class="field">
    <label class="field__label" for="phone">{{ t('form.phone') }} <span class="field__req">*</span></label>
    <input class="input" id="phone" name="phone" type="tel" required
           placeholder="{{ t('form.phone_ph') }}" autocomplete="tel">
  </div>

  <details class="disclosure">
    <summary>{{ t('form.details') }}</summary>
    <div class="stack" style="padding-top: var(--sp-3)">
      <div class="field">
        <label class="field__label" for="name">{{ t('form.name') }}</label>
        <input class="input" type="text" id="name" name="name" placeholder="{{ t('form.name_ph') }}" autocomplete="name">
      </div>
      <div class="field">
        <label class="field__label" for="message">{{ t('form.message') }}</label>
        <textarea class="input" id="message" name="message" rows="4"
                  placeholder="{{ t('form.message_ph') }}"></textarea>
      </div>
    </div>
  </details>

  <button type="submit" id="submitBtn" class="btn btn--primary btn--lg btn--block">
    <span>{{ t('common.callback') }}</span>
  </button>

  <p class="field__hint center">{{ t('form.hint') }}</p>
  <div id="formAlert" class="notice notice--error" role="alert"></div>
</form>
