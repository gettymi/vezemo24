<header class="header" id="js-header">
  <div class="container header__inner">
    <a class="logo" href="{{ url_for('main.index') }}" aria-label="Веземо24 — на головну">
      <span class="logo__word">Веземо</span>
      <span class="logo__badge">24</span>
    </a>

    <nav class="nav" id="js-nav" aria-label="Головна навігація">
      {% set nav_items = [
        ('main.index',        'Головна'),
        ('main.services',     'Послуги'),
        ('main.mizhmiski',    'Міжміські'),
        ('main.calculate_km', 'Розрахувати вартість'),
      ] %}
      {% for endpoint, label in nav_items %}
        <a class="nav__link{% if request.endpoint == endpoint %} is-current{% endif %}"
           href="{{ url_for(endpoint) }}"
           {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}

      <a class="header__phone" href="tel:{{ PHONE_E164 }}" data-cta="phone-header">
        <span aria-hidden="true">📞</span>{{ PHONE_DISPLAY }}
      </a>
      <a class="btn btn--solid-dark" href="{{ url_for('contact.contact') }}">Залишити заявку</a>
    </nav>

    <button class="burger" id="js-burger" type="button"
            aria-label="Відкрити меню" aria-expanded="false" aria-controls="js-nav">
      <span class="burger__line"></span>
      <span class="burger__line"></span>
      <span class="burger__line"></span>
    </button>
  </div>
</header>
